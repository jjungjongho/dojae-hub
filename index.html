<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한양여대 지원단</title>
<meta name="description" content="산학일체형 도제학교 안내, 나에게 맞는 도제학교 찾기, 지원단 공지·일정·지원 요청">
<meta name="theme-color" content="#0f4c81">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--brand:#0f4c81;--brand2:#1a73c9;--accent:#f5b400;--ink:#14213d;--mute:#5b6b82;--line:#e3e8ef;--bg:#f5f7fa;--panel:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:16px;--sh:0 6px 24px rgba(15,40,80,.08)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand2);text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--ink);white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.menu{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}
.menu a{padding:8px 11px;border-radius:10px;color:var(--mute);font-weight:600;font-size:14.5px;white-space:nowrap}.menu a.on{background:#eaf2fb;color:var(--brand)}
main{padding:20px 0 90px}
.hero{background:linear-gradient(135deg,var(--brand),#163a6b 60%,#0b2547);color:#fff;border-radius:22px;padding:28px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.hero h1{font-size:28px;line-height:1.25;margin:14px 0 8px;letter-spacing:-.02em}.hero p{margin:0 0 18px;opacity:.88}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.y{background:var(--accent);color:#1b1b1b}.btn.g{background:#eef2f7;color:var(--ink)}.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}.btn.w{width:100%}.btn:disabled{opacity:.5}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:23px}}@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}.logo span{font-size:15px}}.school .btn{white-space:nowrap}.school>div:last-child{flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.sec{margin-top:26px}.sec h2{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.sec h2 small{margin-left:auto;font-size:13px;font-weight:600}
.quick a{display:flex;flex-direction:column;gap:4px;align-items:flex-start;color:var(--ink)}.quick b{font-size:15.5px}.quick span{font-size:24px}.quick small{color:var(--mute);font-size:12.5px}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.date{flex:none;width:52px;text-align:center;background:#eaf2fb;color:var(--brand);border-radius:12px;padding:6px 0;font-weight:800;line-height:1.1}.date small{display:block;font-size:11px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f7;color:var(--mute)}
.pill.b{background:#eaf2fb;color:var(--brand)}.pill.ok{background:#e7f8ee;color:var(--ok)}.pill.w{background:#fff4e0;color:var(--warn)}.pill.r{background:#fdecec;color:var(--bad)}
.muted{color:var(--mute)}.tiny{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--mute);margin-bottom:10px}
input,select,textarea{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;width:100%}textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer}.chip.on{border-color:var(--brand);background:#eaf2fb;color:var(--brand)}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;font-weight:700;text-align:left;width:100%}.opt span{font-size:24px}.opt.on{border-color:var(--brand);background:#eaf2fb}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--brand)}
.school{display:flex;flex-direction:column;gap:8px}.school h3{margin:0;font-size:17px}.why{background:#f1f7ff;color:var(--brand);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:700;font-size:13px;background:#f8fafc}
.tablewrap{overflow-x:auto}
.copybox{background:#fffbea;border:1px dashed #e8c75a;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--mute)}.tabs2 button.on{background:var(--ink);color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:var(--sh)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:18px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mute);font-size:13px}
.notice h3{margin:0 0 4px;font-size:16px}.notice p{margin:6px 0 0;white-space:pre-wrap}

</style>
</head>
<body>
<header class="top"><div class="wrap nav">
  <a class="logo" href="#/"><i>도</i><span>한양여대 지원단</span></a>
  <nav class="menu" id="menu">
    <a href="#/find">학교 찾기</a><a href="#/notice">공지</a><a href="#/events">일정</a><a href="#/news">지원단 소식</a><a href="#/about">지원단 소개</a><a href="#/teacher">선생님</a><a href="#/admin">지원단</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">고교단계 일학습병행 지원단 · 산학일체형 도제학교 지원 · 문의: 지원단 기관 메일 <span id="ym"></span></div></footer>
<div class="toast" id="toast" hidden></div>
<script>
/* ===== data ===== */
const FIELDS=[['mech','⚙️','기계'],['elec','🔌','전기·전자'],['it','💻','IT·소프트웨어'],['car','🚗','자동차'],['food','🥐','제빵·외식'],['biz','📊','사무·회계'],['trade','🚢','무역·물류']];
const SCHOOLS=[
 {id:'ggm',name:'경기기계공업고등학교',region:'서울',jobs:['선반가공 L2','밀링가공 L2','전산응용기계설계 L2'],fields:['mech']},
 {id:'kwai',name:'광운인공지능고등학교',region:'서울',jobs:['전기시공 L2','전자기기소프트웨어개발 L2'],fields:['elec','it']},
 {id:'dukil',name:'덕일전자공업고등학교',region:'서울',jobs:['전자기기생산 L2'],fields:['elec']},
 {id:'mungok',name:'문곡고등학교',region:'인천',jobs:['세무회계정보관리 L3','제빵 L2'],fields:['biz','food','trade']},
 {id:'magnet',name:'서울매그넷고등학교',region:'서울',jobs:['식음료서비스 L3'],fields:['food']},
 {id:'design',name:'서울디자인고등학교',region:'서울',jobs:['제빵 L2'],fields:['food']},
 {id:'seoil',name:'서일문화예술고등학교',region:'서울',jobs:['식음료서비스 L3','제빵 L2'],fields:['food']},
 {id:'yongsan',name:'용산철도고등학교',region:'서울',jobs:['전자기기하드웨어개발 L3'],fields:['elec','it']},
 {id:'eunpyeong',name:'은평메디텍고등학교',region:'서울',jobs:['전자기기생산 L2'],fields:['elec']},
 {id:'mobility',name:'한국모빌리티고등학교',sub:'구 의정부공업고',region:'경기',jobs:['자동차정비 L2'],fields:['car']}];
const SN=id=>(SCHOOLS.find(s=>s.id===id)||{}).name||'전체';
const CATS=['학습기업 발굴지원','신기술체험캠프','산업안전·AI 활용 지원','지원단 간 협업','경력개발 지원(P-TECH·4년제 연계)','전담인력 전문성 강화','커뮤니티 운영','도제준비과정 운영지원(잡데이·컨설팅·기업투어)','방문 모니터링·유선/방문 컨설팅','도제학교·일학습병행 홍보','운영위원회 개최','학교 지원 요청 처리','기타'];
const REQ=[['banner','🪧','현수막·홍보물 제작'],['car','🚐','차량 지원'],['room','🏫','장소 대관(대학 강의실·실습실)'],['photo','📸','사진·영상 촬영'],['company','🏭','학습기업 발굴·매칭'],['consult','🧭','운영 컨설팅'],['exam','📝','외부평가 준비 지원'],['training','👩‍🏫','교사 연수'],['speaker','🎤','강사·전문가 섭외'],['review','📄','서류·보고서 검토'],['career','🎓','진로·취업 특강(P-TECH 연계)'],['etc','💬','기타']];
const KINDS=['현장실사','기업 발굴 방문','학교 컨설팅','공단 점검','커뮤니티','연수·설명회','신기술체험캠프','잡데이·기업투어','운영위원회','기타'];
/* ===== helpers ===== */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2400)};
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function api(a,body,hdr={}){const r=await fetch('/api/hub?a='+a,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...hdr},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('오류 '+r.status));return j}
const fmtD=d=>{if(!d)return['',''];const x=new Date(d+'T00:00');return[(x.getMonth()+1)+'/'+x.getDate(),'일월화수목금토'[x.getDay()]]};
const dday=d=>{if(!d)return'';const n=Math.round((new Date(d+'T00:00')-new Date(new Date().toDateString()))/864e5);return n<0?'마감':n===0?'D-DAY':'D-'+n};
const copy=t=>{navigator.clipboard?.writeText(t).then(()=>toast('복사했어요. 단톡방에 붙여넣으세요'),()=>toast('복사 실패: 길게 눌러 복사하세요'))};
const ics=e=>{const d=(e.date||'').replace(/-/g,''),t=(e.time||'09:00').replace(':','')+'00';const s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//dojae//KO','BEGIN:VEVENT','UID:'+e.id+'@dojae','DTSTART:'+d+'T'+t,'SUMMARY:'+e.title,'LOCATION:'+(e.place||''),'DESCRIPTION:'+(e.prepare||'').replace(/\n/g,' '),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:내일 일정','END:VALARM','BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:곧 시작','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));a.download='일정.ics';a.click()};
let PUB={notices:[],events:[],toggles:{}};
const fileLinks=n=>(n.files||[]).length?`<div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">${n.files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener" download>📎 ${esc(f.name)}</a>`).join('')}</div>`:'';
const b64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(f)});
async function upFile(f){if(f.size>3.2e6)throw new Error(f.name+': 3MB 초과');const r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json',...H()},body:JSON.stringify({name:f.name,type:f.type,data:await b64(f)})});const j=await r.json();if(!r.ok)throw new Error(j.error);return{name:j.name,url:j.url}}
/* ===== season ===== */
function season(){const m=new Date().getMonth()+1;
 if(m>=9&&m<=11)return{tag:'🎓 입학 시즌',h:'중학생·학부모님,<br>도제학교로 일하며 배우는 길을 찾아보세요',p:'관심 분야와 지역을 고르면 맞는 도제학교와 입학상담 신청까지 한 번에.',cta:['#/find','🔍 나에게 맞는 학교 찾기']};
 if(m===12||m<=2)return{tag:'📋 연말·연초',h:'올해 도제 운영을 정리하고<br>새 학년을 준비해요',p:'사업계획, 외부평가, 실적 제출 일정을 확인하세요.',cta:['#/notice','📢 공지 확인']};
 if(m<=5)return{tag:'🌱 신학기',h:'학습기업 매칭과<br>훈련 시작을 지원합니다',p:'일정 확인, 서류 제출, 지원 요청을 한곳에서.',cta:['#/teacher','👩‍🏫 선생님 공간']};
 return{tag:'☀️ 여름·현장 점검',h:'현장실사와 점검 일정을<br>미리 확인하세요',p:'우리 학교 일정과 준비물을 놓치지 않게 알려드려요.',cta:['#/events','📅 일정 보기']}}
/* ===== pages ===== */
function home(){const s=season(),ev=PUB.events.filter(e=>e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 app.innerHTML=`<section class="hero"><span class="tag">${s.tag}</span><h1>${s.h}</h1><p>${s.p}</p><a class="btn y" href="${s.cta[0]}">${s.cta[1]}</a></section>
 <div class="sec grid g4 quick">${[['#/find','🔍','학교 찾기','분야·지역으로 찾기'],['#/notice','📢','공지사항','지원단 안내'],['#/events','📅','행사 일정','설명회·연수·캠프'],['#/teacher','👩‍🏫','선생님 공간','확인·제출·요청']].map(q=>`<a class="card" href="${q[0]}"><span>${q[1]}</span><b>${q[2]}</b><small>${q[3]}</small></a>`).join('')}</div>
 <div class="sec grid g2"><div><h2>📅 다가오는 일정</h2><div class="card list">${ev.length?ev.map(evRow).join(''):'<div class="empty">예정된 공개 일정이 없어요</div>'}</div></div>
 <div><h2>📢 최근 공지 <small><a href="#/notice">전체 보기</a></small></h2><div class="card list">${PUB.notices.slice(0,5).map(n=>`<div class="it"><div style="flex:1"><b>${esc(n.title)}</b><div class="tiny muted">${n.at.slice(0,10)}${n.deadline?' · 마감 '+n.deadline:''}</div></div>${n.deadline?`<span class="pill w">${dday(n.deadline)}</span>`:''}</div>`).join('')||'<div class="empty">공지가 없어요</div>'}</div></div></div>
 <div class="sec"><h2>📰 지원단 소식 <small><a href="#/news">전체 보기</a></small></h2><div id="hn"><div class="card empty">불러오는 중…</div></div></div><div class="sec"><h2>🏫 관할 도제학교 ${SCHOOLS.length}곳</h2><div class="grid g3">${SCHOOLS.map(s=>schoolCard(s)).join('')}</div></div>`;homeNews()}
const evRow=e=>{const[d,w]=fmtD(e.date);return`<div class="it"><div class="date">${d}<small>(${w})</small></div><div style="flex:1"><b>${esc(e.title)}</b><div class="tiny muted">${esc(e.kind||'')} ${e.time?'· '+esc(e.time):''} ${e.place?'· '+esc(e.place):''}</div>${e.prepare?`<div class="tiny">준비: ${esc(e.prepare)}</div>`:''}</div><button class="btn g sm" onclick='ics(${JSON.stringify(e).replace(/'/g,"&#39;")})'>📆</button></div>`};
const schoolCard=(s,why)=>`<div class="card school"><div><span class="pill b">${s.region}</span></div><h3>${s.name}</h3>${s.sub?`<div class="tiny muted">${s.sub}</div>`:''}${why?`<div class="why">✓ ${why}</div>`:''}<div class="chips">${s.jobs.map(j=>`<span class="pill">${j}</span>`).join('')}</div><div style="display:flex;gap:8px;margin-top:4px"><a class="btn sm" href="#/consult/${s.id}">입학상담 신청</a><a class="btn g sm" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query=${encodeURIComponent(s.name)}">학교 정보</a><button class="btn g sm" onclick="shareSchool('${s.id}')">공유</button></div></div>`;
function shareSchool(id){const s=SCHOOLS.find(x=>x.id===id),url=location.origin+'/#/consult/'+id,t=s.name+' 도제학교 안내';if(navigator.share)navigator.share({title:t,url}).catch(()=>{});else copy(t+'\n'+url)}
/* finder */
let F={step:0,field:null,region:null,plan:null};
function finder(){const steps=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=F.step?'on':''}"></i>`).join('')}</div>`;let body='';

  <div class="tablewrap"><table id="rtab"><tr><th>구분</th><th>당월</th><th>누계(${y})</th><th>지원 학교 수</th></tr>${m.map(x=>`<tr><td>${x.c}</td><td>${x.cur}</td><td>${x.acc}</td><td>${x.sc}</td></tr>`).join('')}</table></div>
  <h3>당월 세부 내역</h3>${m.filter(x=>x.items.length).map(x=>`<p><b>${x.c}</b><br>${x.items.map(l=>`· ${l.date} ${l.school?SN(l.school)+' ':''}${l.company?esc(l.company)+' ':''}${esc(l.note)}`).join('<br>')}</p>`).join('')||'<p class="muted">기록이 없어요</p>'}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="rc">엑셀(CSV) 내려받기</button><button class="btn g" id="rp">표 복사 (한글·엑셀 붙여넣기)</button><button class="btn g" onclick="print()">인쇄·PDF</button></div>`;
  $('#rc').onclick=()=>{const rows=[['구분','당월','누계','지원 학교 수'],...m.map(x=>[x.c,x.cur,x.acc,x.sc]),[],['날짜','항목','학교','기업','내용','건수'],...A.logs.filter(l=>(l.date||'').slice(0,7)===ym).map(l=>[l.date,l.cat,SN(l.school),l.company||'',l.note,l.count])];const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`지원단_실적_${ym}.csv`;a.click()};
  $('#rp').onclick=()=>copy(['구분\t당월\t누계\t지원 학교 수',...m.map(x=>[x.c,x.cur,x.acc,x.sc].join('\t'))].join('\n'))};$('#rm').onchange=draw;draw()}
function aConsult(){ap().innerHTML=`<div class="card"><div class="tablewrap"><table><tr><th>신청일</th><th>학교</th><th>보호자</th><th>연락처</th><th>학년</th><th>종목</th><th>내용</th><th>상태</th></tr>${A.consults.map(c=>`<tr><td>${c.at.slice(0,10)}</td><td>${SN(c.school)}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.grade)}</td><td>${esc(c.field)}</td><td>${esc(c.msg)}</td><td><select data-cs="${c.id}">${['접수','연락 완료','상담 완료'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`)}</select> <button class="btn g sm" data-cd="${c.id}">파기</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">신청이 없어요</td></tr>'}</table></div></div>`;
 ap().querySelectorAll('[data-cs]').forEach(s=>s.onchange=async()=>{await api('consultstatus',{id:s.dataset.cs,status:s.value},H());toast('저장했어요')});
 ap().querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{if(!confirm('개인정보를 파기(삭제)할까요?'))return;await api('del',{col:'consult',id:b.dataset.cd},H());admin()})}
function aSet(){ap().innerHTML=`<div class="grid g2"><div class="card"><h3 style="margin-top:0">🙋 요청 종류 켜기/끄기</h3>${REQ.map(r=>`<label style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-tg="${r[0]}" ${A.toggles[r[0]]!==false?'checked':''} style="width:auto"> ${r[1]} ${r[2]}</label>`).join('')}<button class="btn" id="tgs" style="margin-top:12px">저장</button></div>
 <div class="card"><h3 style="margin-top:0">🔑 학교 코드</h3><p class="tiny muted">선생님이 ‘선생님 공간’에 들어갈 때 쓰는 코드예요. 단톡방으로 각 학교에 보내세요.</p><div class="tablewrap"><table>${SCHOOLS.map(s=>`<tr><td>${s.name}</td><td><b>${A.codes[s.id]}</b></td></tr>`).join('')}</table></div><button class="btn y" id="cpc" style="margin-top:12px">학교 코드 안내 문구 복사</button></div></div>`;
 $('#tgs').onclick=async()=>{const t={};ap().querySelectorAll('[data-tg]').forEach(c=>t[c.dataset.tg]=c.checked);await api('toggles',t,H());toast('저장했어요');A.toggles=t};
 $('#cpc').onclick=()=>copy(`🏫 [한양여대 지원단] 선생님 공간 안내\n아래 주소에서 학교 코드로 들어오시면 공지 확인, 우리 학교 일정, 지원 요청을 하실 수 있어요.\n👉 ${location.origin}/#/teacher\n\n${SCHOOLS.map(s=>s.name+' : '+A.codes[s.id]).join('\n')}`)}
/* ===== router ===== */
function go(h){location.hash=h}
async function route(){const h=location.hash.replace(/^#\/?/,'');const [p,q]=h.split('/');
 document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+p));
 if(p==='find')return finder();if(p==='consult')return consult(q);if(p==='teacher')return teacher();if(p==='admin')return admin();
 if(p==='notice')return notices();if(p==='events')return events();if(p==='about')return about();if(p==='news')return news();home()}
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
$('#ym').textContent='© '+new Date().getFullYear();
(async()=>{try{PUB=await api('public')}catch(e){console.warn(e)}route()})();
</script>
